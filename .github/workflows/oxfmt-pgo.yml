name: oxfmt PGO corpus

on:
  workflow_call:
    inputs:
      package_artifact:
        description: Name of the instrumented oxfmt package artifact.
        required: true
        type: string

permissions: {}

jobs:
  matrix:
    name: Read oxfmt-matrix.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oxc-project/oxc-ecosystem-ci
          ref: main
          path: ecosystem-ci
          persist-credentials: false
          show-progress: false

      - id: matrix
        run: |
          matrix=$(jq -c 'to_entries | map(.value + {id: (.key | tostring)})' ecosystem-ci/oxfmt-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  train:
    name: Train on ${{ matrix.repository }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Clone ${{ matrix.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.path }}
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Setup target repo
        if: ${{ matrix.setup }}
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.setup }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.package_artifact }}
          path: pgo-package

      - name: Install instrumented oxfmt
        run: |
          chmod +x pgo-package/bin/oxfmt
          npm install --prefix pgo-package --no-audit --no-fund
          mkdir -p "${{ matrix.path }}/node_modules/.bin"
          rm -rf "${{ matrix.path }}/node_modules/oxfmt"
          mv pgo-package "${{ matrix.path }}/node_modules/oxfmt"
          ln -sfn ../oxfmt/bin/oxfmt "${{ matrix.path }}/node_modules/.bin/oxfmt"
          echo "$GITHUB_WORKSPACE/${{ matrix.path }}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run oxfmt
        working-directory: ${{ matrix.path }}
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/oxfmt-pgo/%m-%p.profraw
        run: |
          mkdir -p "$RUNNER_TEMP/oxfmt-pgo"
          ${{ matrix.command }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxfmt-pgo-${{ matrix.id }}
          path: ${{ runner.temp }}/oxfmt-pgo/*.profraw
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
